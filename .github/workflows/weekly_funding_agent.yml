name: Weekly Funding Agent

on:
  workflow_dispatch:
  schedule:
    # Ogni lunedì alle 07:00 UTC, cioè circa 08:00/09:00 in Italia a seconda dell'ora legale
    - cron: "0 7 * * 1"

jobs:
  weekly-update:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAILS: ${{ secrets.TO_EMAILS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Verify database configuration
        run: |
          python -c "import os; print('DATABASE_URL configured:', bool(os.getenv('DATABASE_URL')))"

      - name: Crawl funding calls
        run: |
          python run.py crawl

      - name: Send notification email
        run: |
          python run.py notify-email --min-score 5.5